name: Build Windows exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke test (Windows HID via ctypes)
        run: |
          python -c "import ctypes, zaryadka.winhid as w; assert ctypes.sizeof(w.SP_DEVICE_INTERFACE_DATA) == ctypes.sizeof(ctypes.c_void_p) + 24; assert ctypes.sizeof(w.HIDP_CAPS) == 64; print('HID devices found:', len(w._device_paths()))"
          python -m zaryadka --cli

      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Zaryadka run.py

      - name: Check exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Zaryadka.exe -ArgumentList "--cli" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Zaryadka
          path: dist/Zaryadka.exe

      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/Zaryadka.exe \
            --target "$GITHUB_SHA" \
            --title "Zaryadka (последняя сборка)" \
            --notes "Скачайте Zaryadka.exe и запустите. Установка Python не нужна."
